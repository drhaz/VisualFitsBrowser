# Build the user documentation (docs/, MkDocs) and the Javadoc API reference, and
# publish both to GitHub Pages on every push to master.
# Pull requests only build the site, which fails on broken internal links.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

name: Documentation

on:
  push:
    branches: [ "master" ]
    paths: [ "docs/**", "mkdocs.yml", "README.md", "src/main/java/**", ".github/workflows/docs.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "docs/**", "mkdocs.yml", "README.md", "src/main/java/**", ".github/workflows/docs.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments README.md CHANGELOG.md 'docs/**/*.md'
          fail: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Build user documentation
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict --site-dir site

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build API documentation
        run: |
          mvn -B -q javadoc:javadoc
          cp -r target/site/apidocs site/api

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
